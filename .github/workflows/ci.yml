name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Backend tests
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest tests/ -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Frontend build
        run: |
          cd frontend
          npm ci
          npm run build --if-present

      - name: E2E tests
        run: |
          cd tests
          npm ci
          npx playwright install --with-deps
          npx playwright test
        env:
          CI: true

