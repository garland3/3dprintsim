[project]
name = "3dprintsim-backend"
version = "0.1.0"
description = "3D Print Simulator backend (FastAPI + MCP)."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "numpy-stl>=3.1",
    "fastmcp>=3.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false
